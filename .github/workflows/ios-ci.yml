name: iOS 18 Swift 6 Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Xcode 16 Strict Concurrency & DSP Suite
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen Installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Resolve Available iOS 18 Simulator
        id: sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS" in runtime:
                  for d in devices:
                      if "iPhone" in d["name"] and d.get("isAvailable"):
                          print(d["udid"])
                          sys.exit(0)
          sys.exit(1)
          ')
          echo "udid=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected Simulator UDID: $SIM_ID"

      - name: Compile App, Widgets, Shaders & Run Swift Testing Suite
        run: |
          xcodebuild test \
            -project AetherSynthFlow.xcodeproj \
            -scheme AetherSynthFlow \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
