name: Multi-Platform Spatial Swift 6 Matrix CI (iOS 18, visionOS 2, macOS 15, watchOS 11)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Xcode 16 Strict Concurrency — iOS 18, macOS 15, visionOS 2 & watchOS 11
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
          if [ -n "$XCODE_APP" ]; then
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          swift --version

      - name: Ensure XcodeGen Installed
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Multi-Platform Xcode Project
        run: xcodegen generate

      - name: Build Native macOS 15 Studio & Execute Swift Testing Suite
        run: |
          xcodebuild build \
            -project AetherSynthFlow.xcodeproj \
            -scheme AetherSynthMac \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          xcodebuild test \
            -project AetherSynthFlow.xcodeproj \
            -scheme AetherSynthMacTests \
            -destination "platform=macOS" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Resolve Available iOS 18 Simulator
        id: ios_sim
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "iOS" in runtime:
                  for d in devices:
                      if "iPhone" in d["name"] and d.get("isAvailable"):
                          print(d["udid"])
                          sys.exit(0)
          sys.exit(1)
          ')
          echo "udid=$SIM_ID" >> "$GITHUB_OUTPUT"
          echo "Selected iOS Simulator UDID: $SIM_ID"

      - name: Compile iOS 18 App, Widgets, AUv3 Extension, Metal Ray-Tracing Shaders & Run Swift Testing Suite
        run: |
          xcodebuild build \
            -project AetherSynthFlow.xcodeproj \
            -target AetherSynthAUv3 \
            -destination "platform=iOS Simulator,id=${{ steps.ios_sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          xcodebuild build \
            -project AetherSynthFlow.xcodeproj \
            -scheme AetherSynthFlow \
            -destination "platform=iOS Simulator,id=${{ steps.ios_sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
          xcodebuild test \
            -project AetherSynthFlow.xcodeproj \
            -scheme AetherSynthTests \
            -destination "platform=iOS Simulator,id=${{ steps.ios_sim.outputs.udid }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Resolve visionOS 2 Simulator Destination & Compile AetherSynthVision
        run: |
          VISION_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "xrOS" in runtime or "visionOS" in runtime:
                  for d in devices:
                      if d.get("isAvailable"):
                          print(d["udid"])
                          sys.exit(0)
          ' || true)
          if [ -n "$VISION_UDID" ]; then
            VISION_DEST="platform=visionOS Simulator,id=$VISION_UDID"
          else
            VISION_DEST="generic/platform=visionOS Simulator"
          fi
          echo "Using visionOS Destination: $VISION_DEST"
          xcodebuild build \
            -project AetherSynthFlow.xcodeproj \
            -scheme AetherSynthVision \
            -destination "$VISION_DEST" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Resolve watchOS 11 Simulator Destination & Compile AetherSynthWatch
        run: |
          WATCH_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime, devices in sorted(data.items(), reverse=True):
              if "watchOS" in runtime:
                  for d in devices:
                      if "Watch" in d["name"] and d.get("isAvailable"):
                          print(d["udid"])
                          sys.exit(0)
          ' || true)
          if [ -n "$WATCH_UDID" ]; then
            DEST="platform=watchOS Simulator,id=$WATCH_UDID"
          else
            DEST="generic/platform=watchOS Simulator"
          fi
          echo "Using watchOS Destination: $DEST"
          xcodebuild build \
            -project AetherSynthFlow.xcodeproj \
            -scheme AetherSynthWatch \
            -destination "$DEST" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
