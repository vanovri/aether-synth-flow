name: AetherSynthFlow
options:
  bundleIdPrefix: com.aethersynth
  deploymentTarget:
    iOS: "18.0"
    visionOS: "2.0"
    macOS: "15.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AetherSynthFlow:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    # Includes Phases 1–10: Procedural DSP, KEMAR HRTF, MPSGraph, Ray Tracing, Neural Latent Flow,
    # AUv3/PTP Orchestra, 2D FDTD + 4-Ch EEG BCI, SPWVD/HHT, Quantum MPS/DMRG, Volumetric Caustics & Capstone Audit
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Sources/AUv3
    info:
      path: Config/AetherSynthFlow-Info.plist
    entitlements:
      path: Config/AetherSynthFlow.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    dependencies:
      - target: AetherSynthWidgets
        embed: true
      - target: AetherSynthAUv3
        embed: true
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework

  AetherSynthWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Shared
        excludes:
          - "AetherCapstoneBenchmarkSuite.swift"
      - path: Sources/Widgets
    info:
      path: Config/AetherSynthWidgets-Info.plist
    entitlements:
      path: Config/AetherSynthWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.widgets
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework

  AetherSynthAUv3:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/AUv3
      - path: Sources/Shared/PersistenceModels.swift
      - path: Sources/Shared/CognitiveEntrainmentEngine.swift
      - path: Sources/Shared/SpatialPoseTelemeter.swift
      - path: Sources/Shared/DistributedOrchestraEngine.swift
      - path: Sources/Shared/NeuralLatentSoundscapeEngine.swift
      - path: Sources/Shared/WignerVilleHilbertHuangAnalyzer.swift
      - path: Sources/Shared/TensorNetworkQuantumOptimizer.swift
      - path: Sources/App/Audio/AudioSynthEngine.swift
      - path: Sources/App/Audio/ReverbAndFMDSP.swift
      - path: Sources/App/Audio/SpectralFFTAnalyzer.swift
      - path: Sources/App/Audio/SpatialHRTFConvolver.swift
      - path: Sources/App/Audio/ShoeboxRoomAcoustics.swift
      - path: Sources/App/Audio/MetalAcousticRayTracer.swift
      - path: Sources/App/Audio/FDTDWaveguideSolver.swift
      - path: Sources/App/Graphics/AcousticRayTracingKernels.metal
      - path: Sources/App/Graphics/FDTDWaveguideKernels.metal
      - path: Sources/App/Graphics/VolumetricCausticsKernels.metal
    info:
      path: Config/AetherSynthAUv3-Info.plist
    entitlements:
      path: Config/AetherSynthAUv3.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.auv3
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: SwiftUI.framework
      - sdk: Metal.framework

  AetherSynthVision:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Sources/VisionOS
    info:
      path: Config/AetherSynthVision-Info.plist
    entitlements:
      path: Config/AetherSynthVision.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.vision
        XROS_DEPLOYMENT_TARGET: "2.0"
        TARGETED_DEVICE_FAMILY: "7"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: RealityKit.framework
      - sdk: ARKit.framework
      - sdk: CompositorServices.framework
      - sdk: CoreBluetooth.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework

  AetherSynthMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Sources/MacOS
      - path: Sources/AUv3
    info:
      path: Config/AetherSynthMac-Info.plist
    entitlements:
      path: Config/AetherSynthMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.mac
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: ServiceManagement.framework
      - sdk: CoreBluetooth.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework

  AetherSynthWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Sources/Shared
        excludes:
          - "AetherCapstoneBenchmarkSuite.swift"
          - "AetherMeshSyncActor.swift"
          - "DistributedOrchestraEngine.swift"
          - "EEGBrainComputerInterface.swift"
          - "MPSGraphBrainwaveTrainer.swift"
          - "NeuralLatentSoundscapeEngine.swift"
          - "TensorNetworkQuantumOptimizer.swift"
          - "WignerVilleHilbertHuangAnalyzer.swift"
      - path: Sources/WatchOS
    info:
      path: Config/AetherSynthWatch-Info.plist
    entitlements:
      path: Config/AetherSynthWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CoreML.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework

  AetherSynthTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Shared
      - path: Sources/App/Audio
      - path: Sources/App/Graphics
      - path: Sources/App/Haptics
      - path: Sources/AUv3
      - path: Tests/AetherSynthTests
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreBluetooth.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.tests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES

  AetherSynthMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Shared
      - path: Sources/App/Audio
      - path: Sources/App/Graphics
      - path: Sources/App/Haptics
      - path: Sources/AUv3
      - path: Tests/AetherSynthTests
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: CoreBluetooth.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.mac.tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AetherSynthFlow:
    build:
      targets:
        AetherSynthFlow: all
        AetherSynthWidgets: all
        AetherSynthAUv3: all
    run:
      config: Debug

  AetherSynthTests:
    build:
      targets:
        AetherSynthTests: [test, run]
    test:
      config: Debug
      targets:
        - name: AetherSynthTests
          parallelizable: false

  AetherSynthVision:
    build:
      targets:
        AetherSynthVision: all
    run:
      config: Debug

  AetherSynthMac:
    build:
      targets:
        AetherSynthMac: all
    run:
      config: Debug

  AetherSynthMacTests:
    build:
      targets:
        AetherSynthMacTests: [test, run]
    test:
      config: Debug
      targets:
        - name: AetherSynthMacTests
          parallelizable: false

  AetherSynthWatch:
    build:
      targets:
        AetherSynthWatch: all
    run:
      config: Debug
