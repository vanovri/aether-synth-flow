name: AetherSynthFlow
options:
  bundleIdPrefix: com.aethersynth
  deploymentTarget:
    iOS: "18.0"
    visionOS: "2.0"
    macOS: "15.0"
    watchOS: "11.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  AetherSynthFlow:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    # Includes Phase 7 AcousticRayTracingKernels.metal, MetalAcousticRayTracer.swift & NeuralLatentSoundscapeEngine.swift
    # and Phase 8 AUv3 Instrument/Effect Extension & Distributed PTP Orchestra
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Sources/AUv3
    info:
      path: Config/AetherSynthFlow-Info.plist
    entitlements:
      path: Config/AetherSynthFlow.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    dependencies:
      - target: AetherSynthWidgets
        embed: true
      - target: AetherSynthAUv3
        embed: true
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework

  AetherSynthWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/Shared
      - path: Sources/Widgets
    info:
      path: Config/AetherSynthWidgets-Info.plist
    entitlements:
      path: Config/AetherSynthWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.widgets
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
      - sdk: ActivityKit.framework

  AetherSynthAUv3:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources/AUv3
      - path: Sources/Shared/PersistenceModels.swift
      - path: Sources/Shared/DistributedOrchestraEngine.swift
      - path: Sources/Shared/NeuralLatentSoundscapeEngine.swift
      - path: Sources/App/Audio/AudioSynthEngine.swift
      - path: Sources/App/Audio/SpectralFFTAnalyzer.swift
      - path: Sources/App/Audio/SpatialHRTFConvolver.swift
      - path: Sources/App/Audio/ShoeboxRoomAcoustics.swift
      - path: Sources/App/Audio/MetalAcousticRayTracer.swift
      - path: Sources/App/Graphics/AcousticRayTracingKernels.metal
    info:
      path: Config/AetherSynthAUv3-Info.plist
    entitlements:
      path: Config/AetherSynthAUv3.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.auv3
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: SwiftUI.framework
      - sdk: Metal.framework

  AetherSynthVision:
    type: application
    platform: visionOS
    deploymentTarget: "2.0"
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Sources/VisionOS
    info:
      path: Config/AetherSynthVision-Info.plist
    entitlements:
      path: Config/AetherSynthVision.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.vision
        XROS_DEPLOYMENT_TARGET: "2.0"
        TARGETED_DEVICE_FAMILY: "7"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: RealityKit.framework
      - sdk: ARKit.framework
      - sdk: CompositorServices.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework

  AetherSynthMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/Shared
      - path: Sources/App
      - path: Sources/MacOS
      - path: Sources/AUv3
    info:
      path: Config/AetherSynthMac-Info.plist
    entitlements:
      path: Config/AetherSynthMac.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.mac
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: AppKit.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudioKit.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: ServiceManagement.framework
      - sdk: Metal.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: MetalPerformanceShadersGraph.framework

  AetherSynthWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Sources/Shared
      - path: Sources/WatchOS
    info:
      path: Config/AetherSynthWatch-Info.plist
    entitlements:
      path: Config/AetherSynthWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CoreML.framework
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework

  AetherSynthTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/AetherSynthTests
    dependencies:
      - target: AetherSynthFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.tests
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AetherSynthFlow.app/$(BUNDLE_EXECUTABLE_PATH)"

  AetherSynthMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests/AetherSynthTests
    dependencies:
      - target: AetherSynthMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aethersynth.flow.mac.tests
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AetherSynthMac.app/Contents/MacOS/AetherSynthMac"

schemes:
  AetherSynthFlow:
    build:
      targets:
        AetherSynthFlow: all
        AetherSynthWidgets: all
        AetherSynthAUv3: all
        AetherSynthTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AetherSynthTests
          parallelizable: true

  AetherSynthVision:
    build:
      targets:
        AetherSynthVision: all
    run:
      config: Debug

  AetherSynthMac:
    build:
      targets:
        AetherSynthMac: all
        AetherSynthMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: AetherSynthMacTests
          parallelizable: true

  AetherSynthWatch:
    build:
      targets:
        AetherSynthWatch: all
    run:
      config: Debug
